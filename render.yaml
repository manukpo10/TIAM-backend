services:
  - type: web
    name: tiam-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_BACK_URL_SUCCESS
        sync: false
      - key: MP_BACK_URL_FAILURE
        sync: false
      - key: MP_BACK_URL_PENDING
        sync: false
      - key: MP_NOTIFICATION_URL
        sync: false
      - key: CHALLENGE_BACK_URL
        sync: false
      - key: DESAFIO_PLAY_BASE_URL
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PACK_SALES_ENABLED
        sync: false
      - key: PACK_PRICE_ARS
        sync: false
      - key: PACK_GAMES_PRICE_ARS
        sync: false
      - key: PACK_EXTRA_PRICE_ARS
        sync: false
      - key: CUADERNOS_SALES_ENABLED
        sync: false
      - key: CUADERNOS_PRICE_ARS
        sync: false
      - key: CUADERNOS_GAMES_PRICE_ARS
        sync: false
      - key: CUADERNOS_CATALOG_VERSION
        sync: false
      - key: PACK_LANDING_BASE_URL
        sync: false
      - key: PACK_THANKYOU_URL
        sync: false
      - key: PACK_DOWNLOAD_BASE_URL
        sync: false
      - key: EMAIL_ASSETS_BASE_URL
        sync: false
      - key: PACK_ACCESS_DAYS
        sync: false
      - key: PACK_REGRET_NOTIFY_TO
        sync: false
      - key: PACK_OWNER_NOTIFY_TO
        sync: false
      - key: PACK_STORAGE
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: CLIENT_IP_HEADER
        sync: false
      - key: CLIENT_IP_TRUSTED_HOPS
        sync: false
