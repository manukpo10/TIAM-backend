server:
  port: ${PORT:8080}
  # Behind Render's proxy the TCP peer is the proxy. "native" lets Tomcat's remote-ip valve skip the
  # private-network proxies and take the first PUBLIC address in X-Forwarded-For as the peer. If a public
  # proxy (Cloudflare) sits in front too, the peer is that proxy's edge: set CLIENT_IP_TRUSTED_HOPS=1 (or
  # CLIENT_IP_HEADER=CF-Connecting-IP) below. See com.tiam.common.web.ClientIpResolver. Verify it live with
  # CLIENT_IP_DIAGNOSTICS=true once; the pack rate limits and the "same visit" check depend on it.
  forward-headers-strategy: native

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's session-mode pooler caps total clients at 15. Render deploys
      # without downtime, so the old and new instances briefly run at once — two
      # pools must fit within that cap. Keep this small (default is 10, which
      # made 10+10=20 > 15 and broke every deploy with EMAXCONNSESSION).
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Include null fields in responses — the frontend was built expecting explicit
    # nulls (e.g. ownerId: null for TIAM exercises). Omitting them broke null checks.
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  task:
    execution:
      # @Async work (the after-payment access email) gets up to 20s to finish on
      # SIGTERM instead of being interrupted mid-send during a Render deploy.
      shutdown:
        await-termination: true
        await-termination-period: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

supabase:
  url: ${SUPABASE_URL:}
  service-key: ${SUPABASE_SERVICE_KEY:}
  bucket: ${SUPABASE_BUCKET:exercise-images}

tiam:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  net:
    client-ip:
      # Single-valued header set by a proxy you trust (e.g. CF-Connecting-IP). Empty = use X-Forwarded-For.
      header: ${CLIENT_IP_HEADER:}
      # Public proxies in front of the app beyond the private ones Tomcat skips (Cloudflare = 1).
      trusted-proxy-hops: ${CLIENT_IP_TRUSTED_HOPS:0}
      # Logs peer / X-Forwarded-For / resolved address for every pack request. Turn on for the live test only.
      diagnostics: ${CLIENT_IP_DIAGNOSTICS:false}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
  plans:
    professional-monthly-amount: 20000
    professional-annual-amount: 200000
    back-url-success: ${MP_BACK_URL_SUCCESS:http://localhost:5173/subscription/success}
    back-url-failure: ${MP_BACK_URL_FAILURE:http://localhost:5173/subscription/failure}
    back-url-pending: ${MP_BACK_URL_PENDING:http://localhost:5173/subscription/pending}
    notification-url: ${MP_NOTIFICATION_URL:}
  challenge:
    back-url: ${CHALLENGE_BACK_URL:http://localhost:5173/desafio-30-dias/exito}
    # Shared secret for POST /challenge/admin/grants (manual access grants for
    # buyers who paid outside Mercado Pago) — see ChallengePurchaseController.
    # Unset in dev on purpose: the endpoint fails closed with no secret configured.
    admin-grant-secret: ${CHALLENGE_ADMIN_GRANT_SECRET:}
    reconciliation:
      # Safety net for lost webhook notifications — see ChallengePurchaseReconciliationService.
      enabled: ${CHALLENGE_RECONCILIATION_ENABLED:true}
      interval-ms: ${CHALLENGE_RECONCILIATION_INTERVAL_MS:900000} # 15 minutes
      grace-period-minutes: ${CHALLENGE_RECONCILIATION_GRACE_PERIOD_MINUTES:10}
      # 30, not a short "abandoned cart" window — see ChallengeReconciliationProperties
      # for why (cash-coupon payments can confirm days after the purchase was created).
      lookback-days: ${CHALLENGE_RECONCILIATION_LOOKBACK_DAYS:30}
    email-retry:
      # Re-sends the access email to paid purchases that never got it — see ChallengeAccessEmailRetryService.
      enabled: ${CHALLENGE_EMAIL_RETRY_ENABLED:true}
      interval-ms: ${CHALLENGE_EMAIL_RETRY_INTERVAL_MS:900000} # 15 minutes
      min-age-minutes: 5
      lookback-hours: 72
  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    desafio-play-base-url: ${DESAFIO_PLAY_BASE_URL:http://localhost:5173/desafio}
    sales-page-url: ${DESAFIO_SALES_URL:http://localhost:5173/desafio-30-dias}
    # Public number (same one the frontend links to), so it is safe as a default.
    business-number: ${WHATSAPP_BUSINESS_NUMBER:5492214817297}
  email:
    # Transactional email via Resend. Both unset = emails are only logged, not sent
    # (see EmailConfig). The sender domain must be verified in Resend.
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:}
  pack:
    # Printable pack sales (Mercado Pago + download links). Off until the owner flips it on.
    # Starting a checkout is the only thing gated: paid orders keep downloading when it is off.
    sales-enabled: ${PACK_SALES_ENABLED:false}
    # DEVELOPMENT ONLY. With sales on, the checkout refuses to start unless files come from R2, email really
    # goes out (Resend) and the URLs are public https (see PackSalesReadiness). This lifts that so the whole
    # flow can be tried on a laptop. Ignored under the prod profile. Do NOT set it in a real deployment.
    dev-mode: ${PACK_DEV_MODE:false}
    # Prices are decided HERE, never by the browser.
    price-ars: ${PACK_PRICE_ARS:14990}
    games-price-ars: ${PACK_GAMES_PRICE_ARS:10000}
    extra-price-ars: ${PACK_EXTRA_PRICE_ARS:4990}
    landing-base-url: ${PACK_LANDING_BASE_URL:http://localhost:5173}
    thankyou-url: ${PACK_THANKYOU_URL:http://localhost:5173/pack/gracias}
    download-base-url: ${PACK_DOWNLOAD_BASE_URL:http://localhost:5173/pack/descargas}
    access-days: ${PACK_ACCESS_DAYS:90}
    catalog-version: ${PACK_CATALOG_VERSION:v1}
    regret-notify-to: ${PACK_REGRET_NOTIFY_TO:}
    owner-notify-to: ${PACK_OWNER_NOTIFY_TO:}
    reconciliation:
      # Safety net for lost webhooks — see PackOrderReconciliationService.
      enabled: ${PACK_RECONCILIATION_ENABLED:true}
      interval-ms: ${PACK_RECONCILIATION_INTERVAL_MS:900000} # 15 minutes
      grace-period-minutes: 10
      lookback-days: 14
      failed-lookback-days: 3
      max-per-run: 100
    email-retry:
      # Re-sends the access email to paid orders that never got it — see PackEmailRetryService.
      enabled: ${PACK_EMAIL_RETRY_ENABLED:true}
      interval-ms: ${PACK_EMAIL_RETRY_INTERVAL_MS:900000} # 15 minutes
      min-age-minutes: 5
      lookback-hours: 72
    downloads:
      url-ttl-seconds: 300
      daily-cap: 30
      total-cap: 300
    rate-limits:
      # Coarse on purpose: mobile carriers (CGNAT) put many buyers behind one public address, and an
      # address we cannot read is never limited. The strict limits are per (email, visitor).
      checkout-per-ip: 20             # per 10 minutes
      pending-per-email-and-ip: 3     # checkouts per (email, visitor) per hour
      pending-per-email: 20           # PENDING orders per email per hour, whoever started them (loose ceiling)
      token-calls-per-ip: 60          # per (visitor, token) per minute
      token-calls-per-ip-total: 600   # per visitor per minute, across tokens
      resend-per-email: 3             # per day, counted only for emails that really have a paid order
      resend-per-ip: 30               # per hour
      regret-per-ip: 10               # per hour
      regret-per-email: 2             # per day
      regret-receipts-per-day: 100    # receipts emailed to buyers by the regret form, in total
    storage:
      # r2 | local. Empty = r2 when every R2_* value is set, otherwise local (development only).
      type: ${PACK_STORAGE:}
      local-dir: ${PACK_STORAGE_LOCAL_DIR:./pack-files}
      local-base-url: ${PACK_LOCAL_BASE_URL:http://localhost:8080}
      r2-account-id: ${R2_ACCOUNT_ID:}
      r2-access-key-id: ${R2_ACCESS_KEY_ID:}
      r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      r2-bucket: ${R2_BUCKET:}
